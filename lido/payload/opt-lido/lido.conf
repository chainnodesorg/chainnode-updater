# lido provisioning constants — sourced by firstboot/stage1/stage2 (runs on-device).
HOSTNAME_TARGET=chainnode
PROV_USER=user
PROV_PASS=password
# Same groups vany has on `c` — full device control.
USER_GROUPS="tty disk dialout sudo audio operator video plugdev games users systemd-journal input render netdev docker"

NVME_DEV=/dev/nvme0n1
BC_VOLUME=/mnt/blockchain                 # one big blockchain volume on the NVMe root
ETHD_DIR=/home/user/eth-docker
ETHD_REPO=https://github.com/eth-educators/eth-docker.git

# Pin Docker to the versions running on `c` (fall back to latest if unavailable).
DOCKER_VER="5:29.5.3-1~debian.13~trixie"

# stage1 replicates armbian-install option 4: it writes SPI from THIS board's OWN
# u-boot package via the official write_uboot_platform_mtd() — matched to the NVMe
# /boot it installs. Board gate only (refuse anything but OPi5+/RK3588).
EXPECT_BOARD=orangepi5-plus
EXPECT_SOC=rk3588

STATE_DIR=/opt/lido
LOG=/var/log/lido-provision.log
